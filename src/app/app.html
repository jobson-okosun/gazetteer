<div class="h-full w-full relative z-0">
    <div id="map" class="w-full h-full"></div>  
</div>

@if(appResourceAndDataLoaded()) {
    <country-picker class="fixed bottom-4 lg:top-2 lg:left-[250px] lg:transform-none left-1/2 -translate-x-1/2 z-10 w-auto max-w-[calc(100%-2rem)] sm:max-w-lg md:max-w-xl lg:max-w-2xl xl:max-w-2xl" />
    <layer-picker class="fixed top-2 left-2 z-10 w-auto" />
}

@if(!appResourceAndDataLoaded()) {
    <div class="loader-d flex items-center justify-center inset-0 fixed z-50 flex-col gap-1 p-3">
        <img class="loader "src="loader.gif" alt="Walking loader">
        <span class="text-xs mt-2">Loading...</span>
    </div>
}
